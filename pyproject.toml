[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pip-viper"
version = "7.0.0"
description = "A modern, offline-first Python IDE built on PySide6."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Dustin Hill", email = "droxai25@outlook.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Editors :: Integrated Development Environments (IDE)",
]
dependencies = [
    "PySide6>=6.5.0",
    "pydantic>=2.0.0",
    "jedi>=0.19.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "autoflake>=2.0.0",
]

# Registers a global terminal script trigger
[project.scripts]
pip-viper = "src.app:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider --basetemp=.pytest_tmp_run"
norecursedirs = [".*", "_*", "tmp*", "temp*"]




[tool.hatch.build.targets.wheel]
packages = ["src"]